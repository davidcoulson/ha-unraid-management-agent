name: Enhancement request
description: Request a new capability or improvement to an existing integration workflow.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an enhancement idea.

        Use this form for concrete integration improvements you want tracked.
        For support questions or troubleshooting, use Discussions instead.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the integration would this improve most directly?
      options:
        - API client and WebSocket
        - Coordinator refresh and updates
        - Config flow and options
        - Sensors
        - Binary sensors
        - Switches
        - Buttons
        - Number entities
        - Update entities
        - Frontend dashboard cards
        - Diagnostics or repairs
        - Documentation
        - CI or repository automation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current limitation, friction, or missing capability.
      placeholder: Explain the user problem first, not just the proposed fix.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the outcome or workflow that would solve the problem.
      placeholder: Describe the improvement as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share workarounds or other approaches already considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, related issues, or operational context.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions before opening this enhancement request.
          required: true
        - label: I confirm this request targets the Home Assistant integration, not the backend/plugin repository.
          required: true
        - label: I read and agree to follow AGENTS.md and repository contribution rules for this request.
          required: true
